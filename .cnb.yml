main:
  push:
    - name: build-sip2agent
      runner:
        tags: cnb:arch:amd64
      services:
        - docker
      docker:
        volumes:
          - /usr/local/cargo/registry
          - /root/.cache/sip2agent-target
      env:
        # 镜像地址 = 仓库所在 cnb 镜像仓库 + 仓库路径(小写)
        IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
      stages:
        - name: ci
          image: rust:1.92-bookworm
          env:
            # target 目录挂 volume,跨构建复用增量产物
            CARGO_TARGET_DIR: /root/.cache/sip2agent-target
          script:
            # crates 走 rsproxy.cn 国内镜像,防 crates.io 链路抖动(与 Dockerfile 一致)
            - printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > /usr/local/cargo/config.toml
            # 官方镜像是 minimal profile,不一定带 rustfmt/clippy
            - rustup component add rustfmt clippy
            - cargo fmt --check
            - cargo clippy --locked --all-targets -- -D warnings
            - cargo test --locked

        - name: build-and-push
          script:
            - TAG=$(date +%Y%m%d)-$(echo "$CNB_COMMIT" | cut -c1-7)
            - echo "build and push $IMAGE:$TAG"
            - docker buildx build --platform linux/amd64 --progress=plain --cache-from type=registry,ref=$IMAGE:buildcache --cache-to type=registry,ref=$IMAGE:buildcache,mode=max,image-manifest=true -t "$IMAGE:$TAG" -t "$IMAGE:latest" --push .
            - echo "pushed $IMAGE:$TAG"

# 发版:tag v* → linux x86_64 / aarch64(交叉编译)二进制 + cnb Release 附件 + 版本号镜像。
# 与 GitHub release.yml 产物同名;macOS 只在 GitHub 出。
# 补发历史 tag(config 须走 --data 的 JSON,--config 会把 \n 转义吃掉):
#   cnb build start-build --repo <仓库> --data "$(python3 -c "import json;print(json.dumps({'tag':'vX.Y.Z','event':'api_trigger_release','config':open('.cnb.yml').read()}))")"
.release: &release
  - name: release-sip2agent
    runner:
      tags: cnb:arch:amd64
    services:
      - docker
    docker:
      volumes:
        - /usr/local/cargo/registry
    env:
      IMAGE: ${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}
    stages:
      - name: build-binaries
        image: rust:1.92-bookworm
        script:
          - printf '[source.crates-io]\nreplace-with = "rsproxy-sparse"\n[source.rsproxy-sparse]\nregistry = "sparse+https://rsproxy.cn/index/"\n' > /usr/local/cargo/config.toml
          - apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          - rustup target add aarch64-unknown-linux-gnu
          - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          - |
            set -e
            mkdir -p dist
            for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
              cargo build --release --locked --bin sip2agent --target $t
              name=sip2agent-${CNB_BRANCH}-$t
              mkdir -p dist/$name
              cp target/$t/release/sip2agent config.example.toml README.md LICENSE dist/$name/
              tar -C dist -czf dist/$name.tar.gz $name
              (cd dist && sha256sum $name.tar.gz > $name.tar.gz.sha256)
              rm -rf dist/$name
            done
            ls -lh dist

      - name: changelog
        image: cnbcool/changelog
        settings:
          latestChangeLogTarget: LATEST_CHANGELOG.md

      - name: create-release
        type: git:release
        options:
          tag: ${CNB_BRANCH}
          descriptionFromFile: LATEST_CHANGELOG.md
          latest: true

      - name: upload-attachments
        image: cnbcool/attachments:latest
        settings:
          tag: ${CNB_BRANCH}
          attachments:
            - "dist/*.tar.gz"
            - "dist/*.sha256"

      - name: push-version-image
        script:
          - VER=${CNB_BRANCH#v}
          - docker buildx build --platform linux/amd64 --progress=plain --cache-from type=registry,ref=$IMAGE:buildcache -t "$IMAGE:$VER" --push .
          - echo "pushed $IMAGE:$VER"

"v*":
  tag_push: *release
  api_trigger_release: *release
