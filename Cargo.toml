[package]
name = "sip2agent"
version = "0.1.4"
edition = "2024"
rust-version = "1.92"
description = "Bridge inbound SIP calls to realtime speech-to-speech models over WebSocket"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
futures = "0.3.34"
rand = "0.9"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rsipstack = "0.7.7"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
