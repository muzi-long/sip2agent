# sip2agent 配置示例。复制为 config.toml 后按需修改。
# 启动:sip2agent -c config.toml      校验:sip2agent -c config.toml --check

[sip]
# SIP 监听地址(UDP 必开)
listen = "0.0.0.0:5060"
# 同端口额外监听 TCP
tcp = false
# 公网/对外 IP:写入 SDP c=/o= 以及 SIP Via/Contact(NAT 部署必填)
# external_ip = "203.0.113.10"
# user_agent = "sip2agent"
# 来源 IP 白名单(IP 或 CIDR,支持 IPv6),按 SIP 包的真实来源地址判断,不在名单内回 403。
# 不配 = 任何人都能拨入并消耗厂商额度(启动时会打 WARN),生产环境务必配置或用防火墙限制。
# allow = ["10.0.0.0/8", "203.0.113.7"]

[rtp]
bind_ip = "0.0.0.0"
# RTP 端口范围(只用偶数端口,不收发 RTCP)
port_min = 20000
port_max = 20999
# 持续这么多秒收不到 RTP 就挂断(0 = 不检测)
timeout_secs = 30

[log]
# tracing EnvFilter 语法;RUST_LOG 环境变量优先
level = "info"

# ---------------------------------------------------------------------------
# 路由:按被叫号码(Request-URI user)精确匹配 `match`,都不中再用 `match = "*"`;
# 既没匹配也没有 "*" → 404。
# ---------------------------------------------------------------------------

# 冒烟测试用:原样回放主叫声音
[[agent]]
name = "echo"
match = "9000"
provider = "echo"

# 豆包实时语音 3.0(Seeduplex)
[[agent]]
name = "doubao-cs"
match = "1000"
provider = "doubao"
api_key_env = "DOUBAO_API_KEY"          # 或 api_key = "..."(不会写日志)
voice = "zh_female_vv_jupiter_bigtts"   # 必填,见火山音色列表
instructions = "你是某某公司的电话客服,回答简洁礼貌。"
greeting = "您好,这里是某某客服,请问有什么可以帮您?"
# model = "1.2.6.1"                     # 默认即全双工版本固定值
# url = "wss://openspeech.bytedance.com/api/v3/duplex/realtime/dialogue"
# extension = { dialog = { extra = { strict_audit = true } } }   # 原样透传到 session.create 顶层 extension
tool_webhook = "http://127.0.0.1:8080/sip2agent/tool"
call_end_webhook = "http://127.0.0.1:8080/sip2agent/call-end"
timeout_ms = 10000

[[agent.tools]]
name = "query_order"
description = "按订单号查询订单状态"
parameters = { type = "object", properties = { order_id = { type = "string", description = "订单号" } }, required = ["order_id"] }

# 阿里云百炼 Qwen-Omni 实时
[[agent]]
name = "qwen"
match = "2000"
provider = "qwen_omni"
api_key_env = "DASHSCOPE_API_KEY"
url = "wss://ws-xxxxxxxx.cn-beijing.maas.aliyuncs.com/api-ws/v1/realtime"   # 百炼业务空间地址,不带 model= 时自动追加 ?model=
# model = "qwen3.8-omni-flash-realtime"
voice = "Tina"
instructions = "你是电话客服,回答简洁。"
greeting = "您好,请问有什么可以帮您?"
# turn_detection = "semantic_vad"       # 默认 server_vad
call_end_webhook = "http://127.0.0.1:8080/sip2agent/call-end"

# 通用裸 PCM WebSocket(自建模型服务)
[[agent]]
name = "selfhosted"
match = "*"
provider = "pcm_ws"
url = "ws://127.0.0.1:9100/realtime"
sample_rate = 8000                      # 默认 8000(不重采样)
headers = { X-Tenant = "demo" }
# api_key = "..."                       # 配了就加 Authorization: Bearer
